<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Password Reset</title>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
            line-height: 1.6;
        }
        .container {
            max-width: 600px;
            margin: 0 auto;
            padding: 20px;
            border: 1px solid #ddd;
            border-radius: 5px;
        }
        h1 {
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="email"] {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        button {
            background-color: #ffbf00;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
        button:hover {
            background-color: #e6ac00;
        }
        #result {
            margin-top: 20px;
            padding: 10px;
            border-left: 4px solid #ffbf00;
            background-color: #f9f9f9;
        }
        .spinner {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid rgba(255,191,0,.3);
            border-radius: 50%;
            border-top-color: #ffbf00;
            animation: spin 1s ease-in-out infinite;
            vertical-align: middle;
            margin-right: 10px;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div class="container">
        <h1>Test Password Reset</h1>
        
        <div class="form-group">
            <label for="reset_email">Email Address</label>
            <input type="email" id="reset_email" placeholder="Enter your email address">
        </div>
        
        <button id="resetBtn">Send Reset Code</button>
        
        <div id="result"></div>
    </div>

    <script>
        $(document).ready(function() {
            $('#resetBtn').click(function() {
                const email = $('#reset_email').val();
                const resetBtn = $(this);
                
                if(!email) {
                    $('#result').html('<span style="color:red;">Please enter your email address</span>');
                    return;
                }
                
                // Show loading indicator
                resetBtn.prop('disabled', true);
                resetBtn.html('<div class="spinner"></div> Processing...');
                $('#result').html('');
                
                $.ajax({
                    url: 'forgot_password.php',
                    type: 'POST',
                    data: { reset_email: email },
                    dataType: 'json',
                    cache: false,
                    timeout: 30000, // 30 second timeout
                    success: function(response) {
                        console.log('Response:', response);
                        if(response && response.success === true) {
                            $('#result').html('<span style="color:green;">' + response.message + '</span>');
                        } else if(response && response.message) {
                            $('#result').html('<span style="color:red;">' + response.message + '</span>');
                        } else {
                            $('#result').html('<span style="color:red;">An unexpected response was received. Please try again.</span>');
                            console.error('Unexpected response format:', response);
                        }
                    },
                    error: function(xhr, status, error) {
                        console.error('AJAX Error:', status, error);
                        console.log('Response text:', xhr.responseText);
                        
                        // Try to parse the response if it's JSON
                        try {
                            const errorResponse = JSON.parse(xhr.responseText);
                            if(errorResponse && errorResponse.message) {
                                $('#result').html('<span style="color:red;">' + errorResponse.message + '</span>');
                                return;
                            }
                        } catch(e) {
                            console.error('Error parsing JSON response:', e);
                        }
                        
                        $('#result').html('<span style="color:red;">Something went wrong. Please try again later.</span>');
                    },
                    complete: function() {
                        // Reset button state
                        resetBtn.prop('disabled', false);
                        resetBtn.html('Send Reset Code');
                    }
                });
            });
        });
    </script>
</body>
</html>
